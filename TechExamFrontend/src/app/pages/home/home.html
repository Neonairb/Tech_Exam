<section class="home-grid" aria-label="Gestión de empleados">
  <app-empleados-list
    [refreshRevision]="refreshRevision()"
    [selectedEmployeeId]="selectedEmployeeId()"
    (employeeChanged)="refreshLists()"
    (employeeSelected)="selectEmployee($event)"
  />
  <app-movimientos-list
    [refreshRevision]="refreshRevision()"
    [selectedEmployeeId]="selectedEmployeeId()"
    (showAllRequested)="clearEmployeeSelection()"
  />
</section>
