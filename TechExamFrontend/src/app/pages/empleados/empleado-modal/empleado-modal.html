<div class="modal-backdrop" (click)="closeFromBackdrop($event)">
  <section
    class="employee-modal"
    role="dialog"
    aria-modal="true"
    aria-labelledby="employee-modal-title"
  >
    <header class="modal-header">
      <div>
        <h2 id="employee-modal-title">
          {{ mode() === 'edit' ? 'Editar empleado' : 'Agregar empleado' }}
        </h2>
      </div>

      <button
        class="close-button"
        type="button"
        aria-label="Cerrar modal"
        [disabled]="isSaving()"
        (click)="close()"
      >
        <span aria-hidden="true">&times;</span>
      </button>
    </header>

    <form novalidate (submit)="save($event)">
      <div class="modal-body">
        @if (mode() === 'create') {
          <div class="form-field">
            <label for="employee-id">ID de empleado</label>
            <input
              id="employee-id"
              class="form-control"
              type="number"
              min="1"
              step="1"
              placeholder="Ej. 101"
              [value]="employeeId()"
              (input)="updateEmployeeId($event)"
              [attr.aria-invalid]="idErrorMessage() ? true : null"
              [attr.aria-describedby]="idErrorMessage() ? 'employee-id-error' : null"
              autofocus
            />
            @if (idErrorMessage()) {
              <p id="employee-id-error" class="field-error" role="alert">
                {{ idErrorMessage() }}
              </p>
            }
          </div>
        }

        <div class="form-field">
          <label for="employee-name">Nombre completo</label>
          <input
            id="employee-name"
            class="form-control"
            type="text"
            maxlength="20"
            placeholder="Nombre del empleado"
            [value]="employeeName()"
            (input)="updateEmployeeName($event)"
            [attr.aria-invalid]="nameErrorMessage() ? true : null"
            [attr.aria-describedby]="nameErrorMessage() ? 'employee-name-error' : null"
            [autofocus]="mode() === 'edit'"
          />
          @if (nameErrorMessage()) {
            <p id="employee-name-error" class="field-error" role="alert">
              {{ nameErrorMessage() }}
            </p>
          }
        </div>

        @if (errorMessage()) {
          <div class="form-error" role="alert">{{ errorMessage() }}</div>
        }
      </div>

      <footer class="modal-footer">
        <button class="btn save-button" type="submit" [disabled]="isSaving()">
          @if (isSaving()) {
            <span class="spinner-border spinner-border-sm" aria-hidden="true"></span>
            Guardando...
          } @else {
            {{ mode() === 'edit' ? 'Guardar cambios' : 'Guardar empleado' }}
          }
        </button>
      </footer>
    </form>
  </section>
</div>
